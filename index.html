<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="box">
    <h1>Password Generator</h1>

    <div class="output">
      <input type="text" id="password" placeholder="Your password..." readonly />
      <button onclick="copyPassword()">Copy</button>
    </div>

    <div class="options">
      <label>
        Length: <span id="lengthVal">12</span>
        <input type="range" id="length" min="6" max="32" value="12" oninput="document.getElementById('lengthVal').textContent = this.value" />
      </label>

      <label><input type="checkbox" id="uppercase" checked /> Uppercase (A-Z)</label>
      <label><input type="checkbox" id="lowercase" checked /> Lowercase (a-z)</label>
      <label><input type="checkbox" id="numbers" checked /> Numbers (0-9)</label>
      <label><input type="checkbox" id="symbols" /> Symbols (!@#$)</label>
    </div>

    <button class="generate" onclick="generatePassword()">Generate Password</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
